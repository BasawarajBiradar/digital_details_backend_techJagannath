spring.application.name=digital-identification
server.address=0.0.0.0

# ================= DATABASE =================
#spring.datasource.url=jdbc:mysql://localhost:3306/student_digital_identification?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
#spring.datasource.username=root
#spring.datasource.password=Admin@123
#app.secret=mysecretkeymysecretkeymysecretkey12


## production
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
app.secret=${SECRET_KEY}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ================= JPA =================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =============== AWS CONFIG =========================
aws.region=ap-south-1
aws.s3.bucket-name=student-digital-identification
aws.s3.folder=student-profile-images

# =========== MULTIPART CONFIG ============
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ================= LOGGING ==================
logging.level.software.amazon.awssdk=INFO